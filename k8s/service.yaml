apiVersion: v1
kind: Service
metadata:
  name: vaulty-web
  labels:
    app: vaulty-web
spec:
  type: NodePort
  selector:
    app: vaulty-web
  ports:
    - name: http
      port: 80
      targetPort: http
      # Fixed so the host nginx config can hardcode it; minikube would
      # otherwise assign a random port in the 30000-32767 range on each apply.
      nodePort: 30080
